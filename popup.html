<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rakinote</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Rakinote</h1>
        <p>Quick notes right from your toolbar.</p>
      </header>

      <section class="toolbar" aria-label="Text formatting tools">
        <button type="button" class="tool-btn" data-command="bold" title="Bold"><strong>B</strong></button>
        <button type="button" class="tool-btn" data-command="italic" title="Italic"><em>I</em></button>
        <button type="button" class="tool-btn" data-command="insertUnorderedList" title="Bullet list">• List</button>
        <button type="button" class="tool-btn" data-command="insertOrderedList" title="Numbered list">1. List</button>
      </section>

      <section class="editor-wrap">
        <label for="editor" class="sr-only">Write your note</label>
        <div id="editor" class="editor" contenteditable="true" spellcheck="true" aria-label="Note editor"></div>
      </section>

      <section class="actions">
        <button id="saveNote" type="button" class="primary">Save note</button>
        <button id="clearEditor" type="button" class="secondary">Clear editor</button>
      </section>

      <section class="history-wrap">
        <div class="history-header">
          <h2>History</h2>
          <button id="clearHistory" type="button" class="danger ghost">Delete all</button>
        </div>
        <ul id="history" class="history-list" aria-live="polite"></ul>
      </section>
    </main>

    <template id="historyItemTemplate">
      <li class="history-item">
        <div class="history-content"></div>
        <div class="history-actions">
          <small class="history-time"></small>
          <button type="button" class="danger small delete-note">Delete</button>
        </div>
      </li>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
